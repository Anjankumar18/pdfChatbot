# docker-compose.yml
version: '3.8'

services:

  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./chroma_db:/app/chroma_db
    command: uvicorn api:app --host 0.0.0.0 --port 8000
    restart: unless-stopped

  streamlit:
    build: .
    ports:
      - "8501:8501"
    env_file:
      - .env
    volumes:
      - ./chroma_db:/app/chroma_db
    command: streamlit run app.py --server.port 8501 --server.address 0.0.0.0
    restart: unless-stopped